name: publish

# Publishes `claude-bughunter` to PyPI from release tags, so the CLI can be
# installed as a versioned artifact (`pipx install claude-bughunter`) instead
# of tracking `main` from a git URL (issue #211). Uses PyPI Trusted
# Publishing (OIDC) — no long-lived API token. The maintainer still has to
# create the PyPI project and add this repo as a trusted publisher once;
# until then the publish step fails without publishing anything.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC for PyPI Trusted Publishing

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify the built wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          cbh --help
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
